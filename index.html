<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Music Player</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="player">

        <h1>🎵 Music Player</h1>

        <div class="album">
            <div class="music-icon">🎶</div>
        </div>

        <h2 id="songTitle">Summer Vibes</h2>
        <p id="artist">Mimi Music</p>

        <div class="progress-container">
            <div class="progress" id="progress"></div>
        </div>

        <div class="time">
            <span id="currentTime">0:00</span>
            <span id="duration">0:00</span>
        </div>

        <div class="controls">
            <button onclick="previousSong()">⏮</button>
            <button class="play-btn" onclick="togglePlay()" id="playButton">▶</button>
            <button onclick="nextSong()">⏭</button>
        </div>

        <div class="volume">
            🔊
            <input type="range" id="volume" min="0" max="1" step="0.01" value="1">
        </div>

        <div class="playlist">

            <div class="song active" onclick="selectSong(0)">
                🎵 Summer Vibes
            </div>

            <div class="song" onclick="selectSong(1)">
                🎸 Happy Days
            </div>

            <div class="song" onclick="selectSong(2)">
                🎹 Dream World
            </div>

        </div>

        <audio id="audio"></audio>

    </div>

    <script src="script.js"></script>

</body>
</html>
